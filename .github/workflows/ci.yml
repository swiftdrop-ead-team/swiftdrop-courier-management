name: SwiftDrop CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ============================================================================
  # Frontend Verification Job (React / Vite / TypeScript)
  # ============================================================================
  frontend-ci:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run TypeScript Typecheck
        run: npm run typecheck

      - name: Run Frontend Tests
        run: npm test -- --run

      - name: Build Production Bundle
        run: npm run build

  # ============================================================================
  # Backend Verification Job (Spring Boot / Maven / Java 21)
  # ============================================================================
  backend-ci:
    name: Backend Java 21 Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Verify Identity Service
        working-directory: services/identity-service
        run: mvn clean test --batch-mode

      - name: Verify Parcel Service
        working-directory: services/parcel-service
        run: mvn test --batch-mode

      - name: Verify Merchant Service
        working-directory: services/merchant-service
        run: mvn test --batch-mode

      - name: Verify Dispatch Service
        working-directory: services/dispatch-service
        run: mvn test --batch-mode

      - name: Verify Pricing Service
        working-directory: services/pricing-service
        run: mvn test --batch-mode

      - name: Verify Tracking Service
        working-directory: services/tracking-service
        run: mvn test --batch-mode

      - name: Verify Notification Service
        working-directory: services/notification-service
        run: mvn test --batch-mode

      - name: Verify API Gateway
        working-directory: gateway
        run: mvn clean package -DskipTests=false --batch-mode

  # ============================================================================
  # Docker Compose Build Verification
  # ============================================================================
  docker-build-ci:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Images
        run: docker compose build
