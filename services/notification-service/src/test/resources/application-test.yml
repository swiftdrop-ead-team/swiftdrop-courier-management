server:
  port: 0

spring:
  application:
    name: notification-service-test
  datasource:
    url: jdbc:h2:mem:notification_test_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false

swiftdrop:
  notification:
    mail:
      from: test-notifications@swiftdrop.io
      mock-mode: true
    rabbitmq:
      exchange: dispatch.exchange.test
      queue-status-updated: swiftdrop.notification.status-updated.test-queue
      queue-courier-assigned: swiftdrop.notification.courier-assigned.test-queue
      routing-key-assigned: dispatch.courier.assigned.test
      routing-key-status-updated: dispatch.status.updated.test

