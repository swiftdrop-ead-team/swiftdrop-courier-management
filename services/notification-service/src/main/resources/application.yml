server:
  port: ${NOTIFICATION_SERVICE_PORT:8087}

spring:
  application:
    name: notification-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:swiftdrop_notification}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:swiftdrop_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:swiftdrop_secure_pass_2026!}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:notification@swiftdrop.io}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

swiftdrop:
  notification:
    mail:
      from: ${NOTIFICATION_MAIL_FROM:no-reply@swiftdrop.io}
      sender-name: ${NOTIFICATION_SENDER_NAME:SwiftDrop Logistics}
      mock-mode: ${NOTIFICATION_MOCK_MODE:true}
    rabbitmq:
      exchange: ${DISPATCH_EXCHANGE:dispatch.exchange}
      queue-courier-assigned: swiftdrop.notification.courier-assigned.queue
      queue-status-updated: swiftdrop.notification.status-updated.queue
      routing-key-assigned: ${ROUTING_KEY_COURIER_ASSIGNED:dispatch.courier.assigned}
      routing-key-status-updated: ${ROUTING_KEY_STATUS_UPDATED:dispatch.status.updated}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

