
server:
  port: ${TRACKING_SERVICE_PORT:8086}

spring:
  application:
    name: tracking-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/swiftdrop_tracking}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

swiftdrop:
  tracking:
    exchange: ${TRACKING_EVENT_EXCHANGE:dispatch.exchange}
    routing-key: ${TRACKING_EVENT_ROUTING_KEY:dispatch.status.updated}
    queue: ${TRACKING_EVENT_QUEUE:swiftdrop.tracking.status-updated.queue}
    jwt-secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
