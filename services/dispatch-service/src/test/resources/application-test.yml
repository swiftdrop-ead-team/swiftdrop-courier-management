server:
  port: 0

spring:
  application:
    name: dispatch-service-test
  datasource:
    url: jdbc:h2:mem:dispatch_test_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false

swiftdrop:
  dispatch:
    exchange: dispatch.exchange.test
    routing-key-assigned: dispatch.courier.assigned.test
    routing-key-status-updated: dispatch.status.updated.test
    default-max-workload: 5

