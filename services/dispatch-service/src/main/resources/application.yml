server:
  port: ${DISPATCH_SERVICE_PORT:8084}

spring:
  application:
    name: dispatch-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:swiftdrop_dispatch}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:swiftdrop_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:swiftdrop_secure_pass_2026!}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

swiftdrop:
  dispatch:
    exchange: ${DISPATCH_EXCHANGE:dispatch.exchange}
    routing-key-assigned: ${ROUTING_KEY_COURIER_ASSIGNED:dispatch.courier.assigned}
    routing-key-status-updated: ${ROUTING_KEY_STATUS_UPDATED:dispatch.status.updated}
    default-max-workload: 10

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

