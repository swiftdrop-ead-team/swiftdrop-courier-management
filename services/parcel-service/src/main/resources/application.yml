server:
  port: ${PARCEL_SERVICE_PORT:8082}

spring:
  application:
    name: parcel-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:swiftdrop_parcel}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:swiftdrop_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:swiftdrop_secure_pass_2026!}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:guest}
    password: ${RABBITMQ_DEFAULT_PASS:guest}
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-attempts: 3
        multiplier: 2.0

swiftdrop:
  security:
    jwt:
      secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      expiration: ${JWT_EXPIRATION_MS:900000} # 15 minutes
  rabbitmq:
    exchange:
      parcel: swiftdrop.parcel.exchange
    routing-keys:
      parcel-created: parcel.created
      parcel-status-updated: parcel.status_updated
      parcel-cancelled: parcel.cancelled
    queues:
      tracking: swiftdrop.tracking.parcel-updates
      notification: swiftdrop.notification.parcel-updates
  pricing-service:
    url: ${PRICING_SERVICE_URL:http://localhost:8085}
    connect-timeout-ms: 3000
    read-timeout-ms: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

