server:
  port: 0

spring:
  application:
    name: merchant-service-test
  main:
    banner-mode: "off"
  datasource:
    url: jdbc:h2:mem:merchant_test_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  rabbitmq:
    listener:
      simple:
        auto-startup: false

logging:
  level:
    org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration: OFF

management:
  health:
    rabbit:
      enabled: false

swiftdrop:
  security:
    jwt:
      secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

merchant:
  parcel:
    base-url: http://localhost:8082
    order-path: /api/v1/parcels
  rabbitmq:
    exchange: dispatch.exchange.test
    queue: swiftdrop.merchant.status-updated.test-queue
    routing-key: dispatch.status.updated.test
  webhook:
    encryption-key: test-only-webhook-encryption-key
    allow-localhost: true
    max-attempts: 3
    base-delay-seconds: 1
    max-delay-seconds: 5
    request-timeout-seconds: 2
    scheduler-enabled: false
