version: '3.8'

services:
  # ==============================================================================
  # Database Service — PostgreSQL 16
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: swiftdrop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-swiftdrop_identity}
      POSTGRES_USER: ${POSTGRES_USER:-swiftdrop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-swiftdrop_secure_pass_2026!}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swiftdrop_user} -d ${POSTGRES_DB:-swiftdrop_identity}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swiftdrop-net

  # ==============================================================================
  # Message Broker — RabbitMQ 3
  # ==============================================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: swiftdrop-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - swiftdrop-net

  # ==============================================================================
  # Identity Microservice — Spring Boot 3.4.x / Java 21 (Port 8081)
  # ==============================================================================
  identity-service:
    build:
      context: ./services/identity-service
      dockerfile: Dockerfile
    container_name: swiftdrop-identity-service
    restart: unless-stopped
    ports:
      - "${IDENTITY_SERVICE_PORT:-8081}:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-swiftdrop_identity}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-swiftdrop_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-swiftdrop_secure_pass_2026!}
      SWIFTDROP_SECURITY_JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      SWIFTDROP_SECURITY_JWT_EXPIRATION: ${JWT_EXPIRATION_MS:-900000}
      SWIFTDROP_SECURITY_JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-placeholder-client-id}
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-placeholder-client-secret}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - swiftdrop-net

  # ==============================================================================
  # Dispatch Microservice — Spring Boot 3.4.x / Java 21 (Port 8084)
  # ==============================================================================
  dispatch-service:
    build:
      context: ./services/dispatch-service
      dockerfile: Dockerfile
    container_name: swiftdrop-dispatch-service
    restart: unless-stopped
    ports:
      - "${DISPATCH_SERVICE_PORT:-8084}:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DISPATCH_DB:-swiftdrop_dispatch}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-swiftdrop_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-swiftdrop_secure_pass_2026!}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - swiftdrop-net

  # ==============================================================================
  # Tracking Microservice — Spring Boot 3.4.x / Java 21 (Port 8086)
  # ==============================================================================
  tracking-service:
    build:
      context: ./services/tracking-service
      dockerfile: Dockerfile
    container_name: swiftdrop-tracking-service
    restart: unless-stopped
    ports:
      - "${TRACKING_SERVICE_PORT:-8086}:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${TRACKING_DB:-swiftdrop_tracking}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-swiftdrop_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-swiftdrop_secure_pass_2026!}

      # RabbitMQ
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}

      # JWT
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - swiftdrop-net

  # ==============================================================================
  # AI Assistant & Reports Service — Spring Boot 3.4.x / Java 21 (Port 8089)
  # ==============================================================================
  ai-assistant-service:
    build:
      context: ./services/ai-assistant-service
      dockerfile: Dockerfile
    container_name: swiftdrop-ai-assistant-service
    restart: unless-stopped
    ports:
      - "${AI_SERVICE_PORT:-8089}:8089"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/swiftdrop_reports
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-swiftdrop_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-swiftdrop_secure_pass_2026!}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - swiftdrop-net

  # ==============================================================================
  # API Gateway — Spring Cloud Gateway (Port 8080)
  # ==============================================================================
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: swiftdrop-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      IDENTITY_SERVICE_URL: http://identity-service:8081
      DISPATCH_SERVICE_URL: http://dispatch-service:8084
      TRACKING_SERVICE_URL: http://tracking-service:8086
      AI_SERVICE_URL: http://ai-assistant-service:8089
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      identity-service:
        condition: service_healthy
      dispatch-service:
        condition: service_healthy
      tracking-service:
        condition: service_healthy
      ai-assistant-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - swiftdrop-net

  # ==============================================================================
  # Frontend Application — React / TypeScript / Nginx (Port 3000)
  # ==============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: swiftdrop-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api/v1
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - swiftdrop-net

# ==============================================================================
# Networks
# ==============================================================================
networks:
  swiftdrop-net:
    driver: bridge

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  postgres_data:
    driver: local